# ==============================
#  BASIC SETTINGS
# ==============================
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0
set -g renumber-windows on
# reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "config reloaded!"
# ==============================
#  PREFIX INDICATOR
#  muncul di status bar kalo prefix ditekan
# ==============================
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_prefix_prompt '⌨ PREFIX'
set -g @prefix_highlight_copy_prompt   '󰆏 COPY'
set -g @prefix_highlight_fg 'colour232'
set -g @prefix_highlight_bg 'colour220'
set -g @prefix_highlight_copy_mode_attr 'fg=colour232,bg=colour39'
# tanpa plugin, pakai built-in #{?client_prefix,...}
# ini akan langsung jalan tanpa install plugin apapun
PREFIX_INDICATOR="#{?client_prefix,#[fg=colour232]#[bg=colour220]#[bold] ⌨ PREFIX #[default],}"
# ==============================
#  STATUS BAR
# ==============================
set -g status on
set -g status-interval 1
set -g status-position top
set -g status-style 'bg=default fg=colour255'
# kiri: session name + prefix indicator
set -g status-left-length 60
set -g status-left "#[fg=colour255,bg=colour99,bold] 󰆍 #S #[default] "
# kanan: prefix indicator + date + time
set -g status-right-length 80
set -g status-right "${PREFIX_INDICATOR}#[fg=colour99,bg=default] %Y-%m-%d #[fg=colour232,bg=colour99,bold] %H:%M "
# window list (tengah)
set -g status-justify left
setw -g window-status-format         "#[fg=colour245,bg=default] #I #W "
setw -g window-status-current-format "#[fg=colour255,bg=default,bold] #I #W #[default]"
setw -g window-status-separator      ""
# ==============================
#  PANE BORDER
# ==============================
set -g pane-border-style         'fg=colour238'
set -g pane-active-border-style  'fg=colour99'
set -g pane-border-status        off
# ==============================
#  MESSAGE / COMMAND STYLE
# ==============================
set -g message-style         'fg=colour255,bg=default,bold'
set -g message-command-style 'fg=colour255,bg=default'
# ==============================
#  WINDOW & PANE SETTINGS
# ==============================
set  -g allow-rename          off
setw -g automatic-rename      on
setw -g aggressive-resize     on
# ==============================
#  COPY MODE (vim keybindings)
# ==============================
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi l send -X cursor-right
bind -T copy-mode-vi Escape send -X cancel
# ==============================
#  RESIZE PANE (H J K L)
# ==============================
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
# ==============================
#  SPLIT PANE (lebih intuitif)
# ==============================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'
# ==============================
#  NAVIGATE PANE (vim style)
# ==============================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key c command-prompt -p "window name:" "new-window; rename-window '%%'"
# ==============================
#  SYSTEM CLIPBOARD
# ==============================
if -b 'command -v xclip'          'bind C-y run "tmux save-buffer - | xclip -selection clipboard"'
if -b '[ -n "$WSL_DISTRO_NAME" ]' 'bind C-y run "tmux save-buffer - | clip.exe"'
